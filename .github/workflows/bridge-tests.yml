name: Bridge MVP tests
on:
  push:
    branches: [feat/bridge-mvp-v01]
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/bridge-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bridge integration tests
        working-directory: prototype
        env:
          CREW_QUIET: '1'
        run: python -m unittest discover -s tests -v
